[package]
name = "pool"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# hazmat-crypto: the Poseidon permutation host function (poseidon.rs).
soroban-sdk = { workspace = true, features = ["hazmat-crypto"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["hazmat-crypto", "testutils"] }
