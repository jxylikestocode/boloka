# Fly.io: one always-on machine (flows take minutes and run in-process), a
# volume at /data for the state files. `fly deploy` from app/.
app = "boloka"
primary_region = "yyz"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "boloka_data"
  destination = "/data"
