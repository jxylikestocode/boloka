<?xml version="1.0" encoding="UTF-8"?>
<!-- Boloka: how the pool works (src/PoolAnimation.tsx). Animated with CSS; opens in any browser, embeds in HTML inline or with <img>. -->
<svg class="help-anim" viewBox="0 0 340 214" role="img" aria-label="Dollars from family abroad flow into one shared pool, earn interest there (80% stays in the pool, 20% goes to Boloka), move privately between owners inside the pool, and flow out to the bank as pula" xmlns="http://www.w3.org/2000/svg"><style>
@keyframes help-in { 0% { transform: translate(-70px, -54px) scale(1); opacity: 0 } 12% { opacity: 1 } 78% { transform: translate(0, 0) scale(1); opacity: 1 } 100% { transform: translate(0, 8px) scale(.45); opacity: 0 } }
@keyframes help-splash { 0%, 74% { transform: scale(.2); opacity: 0 } 82% { opacity: .9 } 100% { transform: scale(1.8); opacity: 0 } }
@keyframes help-out { 0% { transform: translate(0, 6px) scale(.45); opacity: 0 } 18% { transform: translate(8px, -14px) scale(1); opacity: 1 } 88% { opacity: 1 } 100% { transform: translate(74px, -56px) scale(1); opacity: 0 } }
@keyframes help-wave { to { transform: translateX(-70px) } }
@keyframes help-rise { 0% { transform: translateY(0) scale(.6); opacity: 0 } 25% { opacity: 1; transform: translateY(-12px) scale(1) } 100% { transform: translateY(-46px) scale(1); opacity: 0 } }
@keyframes help-cut { 0% { transform: translate(0, 0); opacity: 0 } 15% { opacity: 1 } 85% { opacity: 1 } 100% { transform: translate(46px, 66px); opacity: 0 } }
@keyframes help-move { 0% { transform: translate(0, 0); opacity: 0 } 12% { opacity: 1; transform: translate(6px, -3px) } 50% { transform: translate(38px, -8px) } 84% { opacity: 1; transform: translate(70px, -3px) } 100% { transform: translate(76px, 0); opacity: 0 } }
@keyframes help-glow { 0%, 100% { opacity: .35 } 50% { opacity: .9 } }
.help-anim .coin-in { animation: help-in 2.7s ease-in infinite; transform-box: fill-box; transform-origin: center }
.help-anim .splash-in { animation: help-splash 2.7s ease-out infinite; transform-box: fill-box; transform-origin: center }
.help-anim .coin-out { animation: help-out 2.7s ease-out infinite; transform-box: fill-box; transform-origin: center }
.help-anim .wave { animation: help-wave 3.2s linear infinite }
.help-anim .wave.back { animation-duration: 4.6s; animation-direction: reverse }
.help-anim .bubble { animation: help-rise 3s ease-out infinite; transform-box: fill-box; transform-origin: center }
.help-anim .coin-cut { animation: help-cut 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
.help-anim .coin-move { animation: help-move 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
.help-anim .owner-glow { animation: help-glow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
@media (prefers-reduced-motion: reduce) { .help-anim * { animation: none !important } }
</style><defs><clipPath id="help-pool-clip"><rect x="100" y="78" width="140" height="92" rx="22"></rect></clipPath></defs><text x="52" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#14201C" font-family="Inter, system-ui, sans-serif">From family abroad</text><text x="52" y="31" text-anchor="middle" font-size="10" fill="#5B6B66" font-family="Inter, system-ui, sans-serif">arrives as dollars</text><text x="290" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#14201C" font-family="Inter, system-ui, sans-serif">To your bank</text><text x="290" y="31" text-anchor="middle" font-size="10" fill="#5B6B66" font-family="Inter, system-ui, sans-serif">paid out in pula</text><text x="170" y="61" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E7C5B" font-family="Inter, system-ui, sans-serif">Private transfer</text><text x="170" y="73" text-anchor="middle" font-size="9" fill="#5B6B66" font-family="Inter, system-ui, sans-serif">nobody sees who or how much</text><path d="M58 42 C 80 70, 100 80, 128 92" fill="none" stroke="#0E7C5B" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 4"></path><path d="M212 92 C 240 80, 260 70, 284 42" fill="none" stroke="#0E7C5B" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 4"></path><rect x="100" y="78" width="140" height="92" rx="22" fill="#FFFFFF" stroke="#0E7C5B" stroke-width="2"></rect><g clip-path="url(#help-pool-clip)"><g transform="translate(0 104)"><path class="wave back" d="M-70 0 q 17.5 -7 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 V 90 H -70 Z" fill="#A9CDF7"></path></g><g transform="translate(0 108)"><path class="wave" d="M-70 0 q 17.5 -7 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 V 90 H -70 Z" fill="#BFDCFF" fill-opacity="0.95"></path></g><path d="M132 146 Q 170 128 208 146" fill="none" stroke="#0E7C5B" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 4"></path><g transform="translate(120 148)"><circle class="owner-glow" r="11" fill="#FFFFFF" fill-opacity="0.9" style="animation-delay: 0s;"></circle><circle r="3.2" cy="-2.6" fill="#14201C"></circle><path d="M-5.5 5.5 a5.5 5.5 0 0 1 11 0 z" fill="#14201C"></path></g><g transform="translate(220 148)"><circle class="owner-glow" r="11" fill="#FFFFFF" fill-opacity="0.9" style="animation-delay: 2s;"></circle><circle r="3.2" cy="-2.6" fill="#14201C"></circle><path d="M-5.5 5.5 a5.5 5.5 0 0 1 11 0 z" fill="#14201C"></path></g><g transform="translate(132 148)"><g class="coin-move" style="animation-delay: 0.6s;"><circle r="10" fill="#2775CA"></circle><circle r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"></circle><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">?</text></g></g><g transform="translate(128 162)"><g class="bubble" style="animation-delay: 0s;"><circle r="6" fill="#0E7C5B"></circle><text y="3.4799999999999995" text-anchor="middle" font-size="10.2" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">+</text></g></g><g transform="translate(150 162)"><g class="bubble" style="animation-delay: 1.3s;"><circle r="6" fill="#0E7C5B"></circle><text y="3.4799999999999995" text-anchor="middle" font-size="10.2" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">+</text></g></g><g transform="translate(172 162)"><g class="bubble" style="animation-delay: 0.6s;"><circle r="6" fill="#0E7C5B"></circle><text y="3.4799999999999995" text-anchor="middle" font-size="10.2" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">+</text></g></g><g transform="translate(194 162)"><g class="bubble" style="animation-delay: 1.9s;"><circle r="6" fill="#0E7C5B"></circle><text y="3.4799999999999995" text-anchor="middle" font-size="10.2" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">+</text></g></g><g transform="trans