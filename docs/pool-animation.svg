ze="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$</text></g><g class="coin-out" style="animation-delay: 1.35s;"><circle r="10" fill="#2775CA"></circle><circle r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"></circle><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$</text></g><g class="coin-out" style="animation-delay: 2.25s;"><circle r="10" fill="#2775CA"></circle><circle r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"></circle><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">$</text></g></g><text x="12" y="190" font-size="10.5" font-weight="600" fill="#0E7C5B" font-family="Inter, system-ui, sans-serif">Interest from lending on Blend</text><text x="12" y="204" font-size="10" fill="#5B6B66" font-family="Inter, system-ui, sans-serif">80% stays in your savings</text><path d="M228 122 C 248 136, 262 160, 272 186" fill="none" stroke="#0E7C5B" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 4"></path><g transform="translate(228 122)"><g class="coin-cut" style="animation-delay: 0s;"><circle r="5.5" fill="#0E7C5B"></circle><text y="3.19" text-anchor="middle" font-size="9.35" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">+</text></g><g class="coin-cut" style="animation-delay: 1.8s;"><circle r="5.5" fill="#0E7C5B"></circle><text y="3.19" text-anchor="middle" font-size="9.35" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">+</text></g></g><g transform="translate(246 184)"><rect width="84" height="24" rx="12" fill="#0E7C5B"></rect><text x="42" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif">20% to Boloka</text></g></svg>
