<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boloka — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#14201C;-webkit-font-smoothing:antialiased}
a{color:#0E7C5B}a:hover{color:#0A5C44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; border-radius: 50%; background: #0E7C5B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">M</div>
      <div style="font-size: 16px; font-weight: 600">Dumela, Mma Kgosi</div>
    </div>
    <button aria-label="Settings" style="width: 44px; height: 44px; border: none; background: #F4F6F5; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14201C" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <div style="background: #0E7C5B; border-radius: 20px; padding: 24px 22px; color: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 13px; font-weight: 500; opacity: 0.85">Dollar savings</div>
    <div style="font-size: 40px; font-weight: 700; letter-spacing: -0.5px">P {{balance}}</div>
    <div style="font-size: 13px; opacity: 0.85">Held in US dollars · shown in pula</div>
    <div style="margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.16); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; width: fit-content">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l6-6 4 4 6-6"></path></svg>
      +P {{growth}} this month
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
    <button style="height: 56px; border: none; border-radius: 14px; background: #14201C; color: #FFFFFF; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Send to Orange Money</button>
    <button style="height: 56px; border: 1.5px solid #D5DDD9; border-radius: 14px; background: #FFFFFF; color: #14201C; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Show a lender</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; font-weight: 600; color: #5B6B66; text-transform: uppercase; letter-spacing: 0.4px">Recent</div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #F4F6F5; border-radius: 14px">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #E3F3EC; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7 7 7-7"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 600">Money from Lerato</div>
        <div style="font-size: 12px; color: #5B6B66">Today, 09:14</div>
      </div>
      <div style="font-size: 15px; font-weight: 600; color: #0E7C5B">+P 9,900</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #F4F6F5; border-radius: 14px">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #FDEBDD; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4510A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7-7-7 7"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 600">To Orange Money · monthly</div>
        <div style="font-size: 12px; color: #5B6B66">1 Nov</div>
      </div>
      <div style="font-size: 15px; font-weight: 600">−P 3,000</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #F4F6F5; border-radius: 14px">
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #E3F3EC; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l6-6 4 4 6-6"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 600">Interest</div>
        <div style="font-size: 12px; color: #5B6B66">October</div>
      </div>
      <div style="font-size: 15px; font-weight: 600; color: #0E7C5B">+P 94</div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-around; padding-top: 12px; border-top: 1px solid #E6ECE9">
    <a href="#home" aria-label="Home" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0E7C5B; text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="#drip" aria-label="Drip" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B6B66; text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Drip</a>
    <a href="#private" aria-label="Private" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B6B66; text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Private</a>
    <a href="#help" aria-label="Help" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B6B66; text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"></path><path d="M12 17h.01"></path></svg>Help</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"balance":{"editor":"text","default":"31,400"},"growth":{"editor":"text","default":"94"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { balance: this.props.balance ?? '31,400', growth: this.props.growth ?? '94' };
}
}
</script>
</body>
</html>
