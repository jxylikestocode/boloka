<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boloka — Show a lender</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#14201C;-webkit-font-smoothing:antialiased}
a{color:#0E7C5B}a:hover{color:#0A5C44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 22px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="#back" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #F4F6F5; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 600">Show a lender</div>
  </div>

  <div style="font-size: 14px; color: #5B6B66; line-height: 1.5">Prove one fact about your income without showing statements, names or amounts. The lender sees only a yes.</div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 600; color: #5B6B66; text-transform: uppercase; letter-spacing: 0.4px">What to prove</div>
    <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 2px solid #0E7C5B; border-radius: 14px; background: #E3F3EC; cursor: pointer; min-height: 44px">
      <input type="radio" name="claim" checked style="width: 20px; height: 20px; accent-color: #0E7C5B">
      <span style="font-size: 15px; font-weight: 600">I receive at least P {{threshold}} every month</span>
    </label>
    <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid #D5DDD9; border-radius: 14px; cursor: pointer; min-height: 44px">
      <input type="radio" name="claim" style="width: 20px; height: 20px; accent-color: #0E7C5B">
      <span style="font-size: 15px; font-weight: 500">I have received money for at least 6 months</span>
    </label>
    <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid #D5DDD9; border-radius: 14px; cursor: pointer; min-height: 44px">
      <input type="radio" name="claim" style="width: 20px; height: 20px; accent-color: #0E7C5B">
      <span style="font-size: 15px; font-weight: 500">My savings are above P 10,000</span>
    </label>
  </div>

  <div style="background: #F4F6F5; border-radius: 16px; padding: 4px 16px">
    <div style="display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #E6ECE9; font-size: 14px"><span style="color: #5B6B66">Period checked</span><span style="font-weight: 600">May – Oct 2026</span></div>
    <div style="display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #E6ECE9; font-size: 14px"><span style="color: #5B6B66">Lender sees</span><span style="font-weight: 600; color: #0E7C5B">Yes / No only</span></div>
    <div style="display: flex; justify-content: space-between; padding: 14px 0; font-size: 14px"><span style="color: #5B6B66">Lender does not see</span><span style="font-weight: 600; text-align: right">Sender, amounts, history</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="lender" style="font-size: 13px; font-weight: 600; color: #5B6B66">Share with</label>
    <select id="lender" style="height: 52px; border: 1.5px solid #D5DDD9; border-radius: 14px; padding: 0 14px; font: 500 15px Inter, system-ui, sans-serif; color: #14201C; background: #FFFFFF"><option>Letshego Microfinance</option><option>Another lender (enter code)</option></select>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 56px; border: none; border-radius: 14px; background: #0E7C5B; color: #FFFFFF; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Create proof and share</button>
    <div style="font-size: 12px; color: #5B6B66; text-align: center; line-height: 1.5">The proof expires in 30 days. You can cancel it any time.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"threshold":{"editor":"text","default":"5,000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { threshold: this.props.threshold ?? '5,000' };
}
}
</script>
</body>
</html>
